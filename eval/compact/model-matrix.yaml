# compact 评测模型矩阵（供挑选与更新）
#
# 用途：`aemeath eval compact run/quiz` 的候选模型名单。
# 更新方式：从 ~/.agents/aemeath.json 的 models.providers 同步（本文件只保留
# 评测相关字段；selection 为 `provider/model-id`，即 --model 的合法取值）。
schema_version: 1
updated_at: "2026-10-29"

reasoning:
  available_levels: [off, minimal, low, medium, high, xhigh, max]
  input_alias:
    none: off
  eval_request_default: max          # run/quiz 的 --reasoning 默认值
  config_key: context.compact_reasoning
  chain: "requested -> clamp(模型上限) -> server_effort_map -> effective(服务端实际档)"
  notes: |
    归并表（server_effort_map）是服务端实际执行档的权威，允许把低档抬升
    （如 Zhipu off/minimal/low -> low；DeepSeek 无 max 档时折叠到其最高档）。
    #2148 已放宽「effective ≤ requested」校验；请求 Off 不再被判配置错误。

known_risks:
  - id: max-thinking-budget
    summary: "Max 档思考 + COMPACT_MAX_OUTPUT_TOKENS=16384 → thinking 吃满输出预算、正文为空、chunk 降级本地"
    evidence: "session 01a182e6（838K token / 22 chunks）：10 块降级，全部 output=16384 thinking=16384 text_deltas=0"
    mitigation: "待实现独立 compact 输出预算（如 32K/64K）；或 map 阶段降档；紧急止血 context.compact_reasoning=high"
  - id: empty-model-regression
    summary: "#2146 曾让 compact 请求传空 model，LLM 调用恒失败静默降级"
    evidence: "#2152 + PR #2140 已修复并合入 main"
    mitigation: "评测看 quality 档位；非 Llm 行不当成功"

