collection_protocol:
  - "每个候选依次：aemeath eval compact run --cases <dir> --model <selection> --reasoning max --output-dir runs/<sanitized>"
  - "再 quiz：aemeath eval compact quiz --cases <dir> --summaries runs/<sanitized> --model <主模型> --judge <judge_primary> --reasoning max"
  - "单模型失败/降级不牵连其他 run；多次收集，不做一次性矩阵命令"
  - "报告维度：quality → correct_rate/per_epoch → elapsed_ms 与 ms_per_1k_input_tokens → usage token"
