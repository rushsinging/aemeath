recommended_sets:
  compact:
    - Bailian Token Plan/deepseek-v4.1-flash-1017   # 当前默认，实测 Llm
    - Zhipu Coding Plan/glm-5.3-flash               # 同族跨 provider 对照
    - Volcengine/doubao-seed-2.1-lite               # 官方低成本
    - Mimo Token Plan/mimo-v2.6-flash
    - MiniMax/MiniMax-M3.1-Flash-Preview
  judge_primary: Bailian Token Plan/qwen3.8-max     # 与 compact 候选跨族，1M 窗口
  judge_crosscheck: OmniRoute/gpt-6.1-sol           # 最强；第三方网关，注意稳定性
  judge_alt: Kimi/k3.1-pro

collection_protocol:
  - "对每个候选依次执行：aemeath eval compact run --cases <dir> --model <selection> --reasoning max --output-dir runs/<sanitized>"
  - "再执行 quiz：aemeath eval compact quiz --cases <dir> --summaries runs/<sanitized> --model <主模型> --judge <judge_primary> --reasoning max"
  - "单模型失败/降级不牵连其他 run；结果为多次收集，不做一次性矩阵命令"
  - "报告维度：quality 档位 → correct_rate/per_epoch → elapsed_ms 与 ms_per_1k_input_tokens → usage token"
