# 评测模型矩阵（compact / reflect / harness 共用，按原模型聚合）
#
# 原则：以**原模型**为主键，不区分 provider —— 同一模型在多个 provider/网关下
# 只出现一条；effort 能力跟模型厂商官方能力走（网关可能额外透传，不单列）。
# 运行时选择 provider：用本机配置里的 `<provider>/<ids 之一>` 作为 --model。
# 更新方式：从 models.providers 同步；路由类模型（auto/group/cursor-auto）不列入。
schema_version: 2
updated_at: "2026-10-29"

roles:
  compact.compactor: 执行压缩（长上下文 + typed JSON 输出，flash/低成本优先）
  compact.answerer:  续接问答答题（通常主对话模型）
  compact.judge:     续接问答判卷（独立模型，避免自评偏差）
  reflect.reflector: 执行反思（去噪/归纳两阶段）
  reflect.judge:     反思语义判卷（合并忠实性 / outdated 成立性 / 噪音剔除）
  harness.improver:  RSI 改进提案生成
  harness.judge:     RSI 提案与 lesson 评价

reasoning:
  levels: [off, minimal, low, medium, high, xhigh, max]
  input_alias:
    none: off
  eval_request_default: max
  config_key: context.compact_reasoning
  chain: "requested -> clamp(模型上限) -> server_effort_map -> effective(服务端实际档)"
  notes: |
    `available_efforts` 按**原模型官方能力**标注（不按 provider）；`efforts_verified: false`
    表示尚未按厂商文档逐档确认。请求档超出集合时被 clamp/归并。
    已确认来源：OpenAI GPT-6 系列、阿里云百炼（Qwen3.8：low/medium/high/xhigh/max，默认 max）、
    Agnes（布尔思考开关，无分档）、智谱 5.3、方舟、DeepSeek、Kimi K3 官方阶梯。
    已确认（用户实测）：MiniMax M3.1（low/medium/high/xhigh/max）、Beam（off/low/high/max）、
    MiMo 2.6（thinking.type 开关，无分档）。待实测探测：MiniMax M3（同族待确认）。

known_risks:
  - id: max-thinking-budget
    summary: "Max 档思考 + COMPACT_MAX_OUTPUT_TOKENS=16384 → thinking 吃满输出预算、正文为空、chunk 降级本地"
    evidence: "session 01a182e6（838K token / 22 chunks）：10 块降级，全部 output=16384 thinking=16384 text_deltas=0"
    mitigation: "独立 compact 输出预算（32K/64K）/ map 阶段降档 / 紧急 context.compact_reasoning=high"
  - id: empty-model-regression
    summary: "#2146 曾让 compact 请求传空 model → LLM 调用恒失败静默降级"
    evidence: "#2152 + PR #2140 已修复并合入 main"
    mitigation: "评测看 quality 档位；非 Llm 行不当成功"

models:
# 注：max_tokens 为模型输出上限；compact 请求实际最大输出 =
# min(COMPACT_MAX_OUTPUT_TOKENS=16384, max_tokens)。
  - model: "DeepSeek V4.1 Flash"
    ids: ["deepseek-flash", "deepseek-v4.1-flash", "deepseek-v4.1-flash-1017"]
    config_default_effort: high
    available_efforts: [off, low, high]
    efforts_verified: true
    efforts_source: "DeepSeek 官方：minimal→low、medium/xhigh→high；无 max 档折叠最高"
    context_window: 1048576
    max_tokens: 20000
    for: [compact.compactor]
    notes: "网关可能透传更多档；本表按原模型官方能力"
