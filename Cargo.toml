[workspace]
resolver = "2"
members = [
    "apps/cli",
    "agent/composition",
    "agent/features/audit",
    "agent/features/config",
    "agent/features/hook",
    "agent/features/harness",
    "agent/features/memory",
    "agent/features/policy",
    "agent/features/context",
    "agent/features/project",
    "agent/features/provider",
    "agent/features/runtime",
    "agent/features/storage",
    "agent/features/systemone",
    "agent/features/task",
    "agent/features/tools",
    "agent/features/update",
    "agent/features/workflow",
    "agent/shared",
    "packages/sdk",
    "packages/global/logging",
    "packages/global/utils",
    "tools/xtask",
]

[workspace.dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2.1"
async-trait = "0.1"
thiserror = "2"
tokio-util = { version = "0.7", features = ["io", "codec", "rt"] }
futures-util = "0.3"
chrono = "0.4"
reqwest = { version = "0.12", features = ["stream", "json"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
semver = "1"
sha2 = "0.10"
flate2 = "1.0"
tar = "0.4"
inventory = "0.3"
rustix = { version = "1", features = ["fs"] }

[workspace.package]
version = "0.0.0"
edition = "2021"

# 零容忍 lint 基线（#1995）：warning 允许值为 0，本地编译即拦。
# rustc `warnings` 组同时涵盖 rustc 与 clippy 注册的全部 warning 级 lint，
# 故无需单独的 [workspace.lints.clippy] 表；单点豁免用 item 级
# #[allow(...)] + 中文注释说明理由（allow 优先于本表）。
[workspace.lints.rust]
warnings = "deny"
