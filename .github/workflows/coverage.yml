name: Coverage

# 所有 PR 都跑 coverage：ruleset（main-branch-protection.json）将
# "Workspace coverage summary" 设为 required_status_checks，若用 paths 过滤会让
# 只改非匹配路径（如 .agents/hooks/*.sh）的 PR 永不触发该 check → 永远 pending → 卡死。
# 见 #1220 配套讨论。
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Workspace coverage summary
    runs-on: ubuntu-latest
    # 显式覆盖默认 job 超时：GitHub 平台曾对 ~4 分钟的慢 job 强制回收
    # （SIGTERM/exit 143，cache miss 冷启动时必踩），显式设置可在平台
    # 默认超时存在时绕过该限制。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
          workspaces: '. -> target/coverage'

      - name: Install cargo-llvm-cov 0.8.7
        run: |
          # 下载官方预编译二进制替代 `cargo install`（后者每次冷启动编译 ~60s）。
          # cache miss 时全量 instrumented 编译的总时长接近平台回收阈值，
          # 省下的编译时间决定冷启动 run 能否成功建立缓存（详见 #1508 配套调查）。
          curl -L --fail --silent --show-error \
            https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.8.7/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz \
            -o /tmp/cargo-llvm-cov.tar.gz
          tar -xzf /tmp/cargo-llvm-cov.tar.gz -C /tmp
          mkdir -p "$HOME/.cargo/bin"
          mv /tmp/cargo-llvm-cov "$HOME/.cargo/bin/cargo-llvm-cov"
          chmod +x "$HOME/.cargo/bin/cargo-llvm-cov"
          cargo llvm-cov --version

      - name: Print workspace and per-crate coverage
        run: ./scripts/coverage.sh
