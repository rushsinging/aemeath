name: Hook platform contract

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  non-unix-unsupported:
    name: Hook non-Unix unsupported contract
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 不带 @stable：读取 rust-toolchain.toml 的 pinned 版本，与发版一致。
      - uses: dtolnay/rust-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          key: hook-non-unix-contract

      - name: Check Hook crate on Windows
        run: cargo check -p hook --all-targets --locked

      - name: Run non-Unix Hook contract tests
        run: cargo test -p hook unsupported_platform --lib --locked
