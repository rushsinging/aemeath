[package]
name = "composition"
version.workspace = true
edition.workspace = true

[features]
# System One embedded 评分装配（llama.cpp worker）。默认关闭：遵循计划
# 「默认 workspace 不启用 embedded」——默认构建不链接 llama.cpp、不编译
# 原生运行路径；`cargo test -p composition --features systemone-embedded`
# 显式启用后生产装配入口才具备真实装配能力（否则 typed EmbeddedUnavailable）。
systemone-embedded = ["systemone/embedded"]

[dependencies]
runtime = { path = "../features/runtime" }
config = { path = "../features/config" }
tools = { path = "../features/tools" }
policy = { path = "../features/policy" }
provider = { path = "../features/provider" }
project = { path = "../features/project" }
update = { path = "../features/update" }
audit = { path = "../features/audit" }
storage = { path = "../features/storage" }
context = { path = "../features/context" }
hook = { path = "../features/hook" }
memory = { path = "../features/memory" }
systemone = { path = "../features/systemone" }
task = { path = "../features/task" }
share = { path = "../shared" }
sdk = { path = "../../packages/sdk" }
logging = { path = "../../packages/global/logging" }
tokio = { workspace = true }
tokio-util = { workspace = true }
log = "0.4"
async-trait = { workspace = true }
futures-util = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tools = { path = "../features/tools", features = ["test-harness"] }
task = { path = "../features/task" }
utils = { path = "../../packages/global/utils" }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }
tempfile = "3"
