[package]
name = "composition"
version.workspace = true
edition.workspace = true

[features]
# System One 引擎（llama.cpp worker）仅供 `aemeath scoring serve` / 真机门禁。
# 会话进程的生产装配走 DaemonScoringClient（#1935），**NEVER** 因会话需要而
# 默认启用本 feature。`systemone-embedded` 保留给历史测试与同引擎别名；
# `systemone-daemon` 是 serve 路径推荐门控（`systemone/daemon` ⊃ embedded）。
systemone-embedded = ["systemone/embedded"]
systemone-daemon = ["systemone/daemon"]

[dependencies]
runtime = { path = "../features/runtime" }
config = { path = "../features/config" }
tools = { path = "../features/tools" }
policy = { path = "../features/policy" }
provider = { path = "../features/provider" }
project = { path = "../features/project" }
update = { path = "../features/update" }
audit = { path = "../features/audit" }
storage = { path = "../features/storage" }
context = { path = "../features/context" }
hook = { path = "../features/hook" }
memory = { path = "../features/memory" }
systemone = { path = "../features/systemone" }
harness = { path = "../features/harness" }
task = { path = "../features/task" }
workflow = { path = "../features/workflow" }
share = { path = "../shared" }
sdk = { path = "../../packages/sdk" }
logging = { path = "../../packages/global/logging" }
tokio = { workspace = true }
tokio-util = { workspace = true }
log = "0.4"
async-trait = { workspace = true }
futures-util = { workspace = true }
serde_json = { workspace = true }
uuid = { version = "1", features = ["v7"] }
chrono = "0.4"

[dev-dependencies]
provider = { path = "../features/provider", features = ["dev"] }
runtime = { path = "../features/runtime", features = ["dev"] }
project = { path = "../features/project", features = ["dev"] }
# 测试经 test_support 消费 context port mock（AtomicBlobSessionManagement）。
context = { path = "../features/context", features = ["dev"] }
tools = { path = "../features/tools", features = ["test-harness"] }
task = { path = "../features/task" }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }
tempfile = "3"

# 继承 workspace 零容忍 lint 基线（#1995）。
[lints]
workspace = true
