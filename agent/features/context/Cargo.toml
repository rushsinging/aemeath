[package]
name = "context"
version.workspace = true
edition.workspace = true

[features]
# 跨 crate 测试 fixture（DisplayHistoryStepIndexData::fixture）门控；
# 消费方经 [dev-dependencies] features = ["dev"] 启用。生产不启用。
dev = []

[dependencies]
share = { path = "../../shared" }
utils = { path = "../../../packages/global/utils" }
storage = { path = "../storage" }
task = { path = "../task" }
project = { path = "../project" }
provider = { path = "../provider" }
memory = { path = "../memory" }
config = { path = "../config" }
sdk = { path = "../../../packages/sdk" }
tools = { path = "../tools" }
sha2 = { workspace = true }
log = "0.4"
dirs = "6"
serde = { workspace = true }
serde_json = { workspace = true }
inventory = { workspace = true }
async-trait = { workspace = true }
regex = "1"
thiserror = { workspace = true }
uuid = { version = "1", features = ["v4", "v7"] }
chrono = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }

[dev-dependencies]
testkit = { path = "../../testing/testkit" }
# 测试经 testkit::provider 的脚本化 LlmInvokePort（#2146：该 trait 只允许
# provider 实现）。
provider = { path = "../provider" }
memory = { path = "../memory" }
storage = { path = "../storage" }
project = { path = "../project" }
tools = { path = "../tools", features = ["test-harness"] }
tempfile = "3"

# 继承 workspace 零容忍 lint 基线（#1995）。
[lints]
workspace = true
