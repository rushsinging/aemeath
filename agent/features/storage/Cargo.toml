[package]
name = "storage"
version.workspace = true
edition.workspace = true

[features]
default = []
# 仅供 Storage crash harness 编译故障点；默认生产构建不包含 env/abort 路径。
test-fault-injection = []
# 测试实现面（InMemoryBlobPort 等）。Consumers add `storage` to
# `[dev-dependencies]` with `features = ["dev"]`. Never enabled in production.
dev = []

[dependencies]
tokio = { workspace = true }
log = { version = "0.4", features = ["std"] }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { version = "1", features = ["v4", "v7"] }
cap-std = "4"
async-trait = { workspace = true }
sha2 = { workspace = true }
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "crash_recovery"
required-features = ["test-fault-injection"]

[[test]]
name = "atomic_dataset_crash"
required-features = ["test-fault-injection"]

# 继承 workspace 零容忍 lint 基线（#1995）。
[lints]
workspace = true
