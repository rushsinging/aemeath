[package]
name = "memory"
version.workspace = true
edition.workspace = true

[features]
# 测试实现面。Consumers add `memory` to `[dev-dependencies]`
# with `features = ["dev"]`. Never enabled in production.
dev = []

[dependencies]
async-trait.workspace = true
chrono = { workspace = true }
log = "0.4"
serde.workspace = true
serde_json.workspace = true
share = { path = "../../shared" }
storage = { path = "../storage" }
systemone = { path = "../systemone" }
fs2 = "0.4"
thiserror.workspace = true
tokio.workspace = true
utils = { path = "../../../packages/global/utils" }
uuid = { version = "1", features = ["serde", "v7"] }

[dev-dependencies]
systemone = { path = "../systemone", features = ["dev"] }

# 继承 workspace 零容忍 lint 基线（#1995）。
[lints]
workspace = true
