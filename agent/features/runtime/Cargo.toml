[package]
name = "runtime"
version.workspace = true
edition.workspace = true

[features]
# Enables test-only session_switch helpers. Consumers must add `runtime` to
# `[dev-dependencies]` with `features = ["dev"]`. Never enabled in production.
dev = []

[dependencies]
share = { path = "../../shared" }
utils = { path = "../../../packages/global/utils" }
config = { path = "../config" }
provider = { path = "../provider" }
tools = { path = "../tools" }
project = { path = "../project" }
memory = { path = "../memory" }
systemone = { path = "../systemone" }
policy = { path = "../policy" }
harness = { path = "../harness" }
context = { path = "../context" }
storage = { path = "../storage" }
task = { path = "../task" }
workflow = { path = "../workflow" }
hook = { path = "../hook" }
audit = { path = "../audit" }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
futures = "0.3"
base64 = "0.22"
async-trait = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
log = "0.4"
env_logger = "0.11"
dirs = "6"
uuid = { version = "1", features = ["v4", "v7"] }
chrono = "0.4"
inventory = { workspace = true }
parking_lot = "0.12"
rand = "0.9"
regex = "1"
thiserror = { workspace = true }
sdk = { path = "../../../packages/sdk" }
logging = { path = "../../../packages/global/logging" }

tempfile = "3"

[dev-dependencies]
provider = { path = "../provider", features = ["dev"] }
# 自引用：integration tests（tests/）编译时 lib 不带 --test，
# test helper 需 dev feature 才可见。
runtime = { path = ".", features = ["dev"] }
tools = { path = "../tools", features = ["test-harness"] }
futures-util = { workspace = true }
context = { path = "../context", features = ["dev"] }

# 继承 workspace 零容忍 lint 基线（#1995）。
[lints]
workspace = true
