[package]
name = "tools"
version.workspace = true
edition.workspace = true

[features]
test-harness = []

[dependencies]
share = { path = "../../shared" }
project = { path = "../project", features = ["test-harness"] }
memory = { path = "../memory" }
systemone = { path = "../systemone" }
task = { path = "../task" }
workflow = { path = "../workflow" }
utils = { path = "../../../packages/global/utils" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
base64 = "0.22"
glob = "0.3"
reqwest = { version = "0.12", features = ["blocking", "stream"] }
chrono = "0.4"
log = "0.4"
url = "2"
percent-encoding = "2"
bytes = "1"
futures-util = { workspace = true }
parking_lot = "0.12"
bitflags = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v7"] }
htmd = "0.5"
scraper = "0.27"
sha2 = { workspace = true }
serde_yml = "0.0.12"

[build-dependencies]
syn = { version = "2", features = ["full", "parsing", "extra-traits"] }
proc-macro2 = "1"

[dev-dependencies]
project = { path = "../project", features = ["dev"] }
systemone = { path = "../systemone", features = ["dev"] }
tempfile = "3"

# 继承 workspace 零容忍 lint 基线（#1995）。
[lints]
workspace = true
