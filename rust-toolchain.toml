# 统一本地与 CI 的 Rust 工具链版本，保证发版可复现：
# - CI 各 workflow 的 dtolnay/rust-toolchain action 不带版本时读取本文件；
# - 防止 stable 升级引入的新 clippy 规则在发版时才暴露（如 1.99 的
#   double_must_use 与 async-trait 0.1.90+ 宏展开冲突导致发版阻断）；
# - 升级工具链时修改本文件的 channel，并在本地跑
#   `cargo clippy --workspace --locked -- -D warnings` 确认后再合入。
[toolchain]
channel = "1.97.0"
components = ["rustfmt", "clippy"]
